# Pokemon Red — cross-stage progression milestones.
#
# Hand-authored from per-stage verdict docs (n=3/n=5 results.jsonl).
# Consumed by `autoresearch-compare progression` to render
# experiments/progress/pokemon_stage_progression.png.
#
# Refresh after each stage verdict:
#   uv run autoresearch-compare append-milestone \
#       --yaml experiments/milestones/pokemon_progression.yaml \
#       --label "Stage X (...)" \
#       --from-results-jsonl experiments/<task>/<config>/results.jsonl \
#       --extract evaluation_score=evaluation_score
#
# Render:
#   uv run autoresearch-compare progression \
#       -m experiments/milestones/pokemon_progression.yaml \
#       --out experiments/progress/pokemon_stage_progression.png

title: "Pokemon Red — Stages D → N+O progression"
primary_metric: evaluation_score
threshold: 57.14
threshold_label: "M4 ceiling"

milestones:
  - label: "Stage D (post-asm)"
    description: "vmem + planner + procs (baseline)"
    metrics:
      evaluation_score: 57.14
  - label: "Stage H (post-asm)"
    description: "qwen35-A3B-Int4 (no thinking)"
    metrics:
      evaluation_score: 57.14
  - label: "Stage J"
    description: "qwen30-A3B-Thinking (REGRESS)"
    metrics:
      evaluation_score: 28.57
  - label: "Stage K (post-asm)"
    description: "cumulative cross-ep memory"
    metrics:
      evaluation_score: 57.14
  - label: "Stage L"
    description: "iter-TTL + map-aware proc keys"
    metrics:
      evaluation_score:
        mean: 51.43
        std: 12.78    # n=5 sigma — requires autoresearch >= 0.23 (PR #62)
  - label: "Stage M"
    description: "sdc × novelty × lpc selector signals"
    metrics:
      evaluation_score:
        mean: 51.43
        std: 12.78
