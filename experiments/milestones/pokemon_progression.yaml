# Pokemon Red — cross-stage progression milestones.
#
# Hand-authored from per-stage verdict docs (n=3/n=5 results.jsonl).
# Consumed by `experiments/plot_pokemon_progression.py` to render
# experiments/progress/pokemon_stage_progression.png.
#
# Refresh after each stage verdict — edit this file in place, then run:
#   uv run python experiments/plot_pokemon_progression.py
#
# Score-axis bars to keep in mind:
#   - M4 ceiling = 57.14% (every selector / scaffold intervention since
#     Stage D has converged here on pokemon_red; gate is the Charmander
#     nickname dialog / OaksLab → Route 1 transition).
#   - M5 ceiling = 71.43% (no stage has crossed; gate is Oak's Parcel
#     delivery at the Route 1 / Viridian boundary + wild-encounter
#     gauntlet).

title: "Pokemon Red — Stages D → Q2 progression"
primary_metric: evaluation_score
thresholds:
  - { value: 57.14, label: "M4 ceiling", color: "tab:green" }
  - { value: 71.43, label: "M5 ceiling", color: "tab:gray" }

milestones:
  - label: "Stage D (post-asm)"
    description: "vmem + planner + procs"
    verdict: BASELINE
    n: 3
    metrics:
      evaluation_score: { mean: 57.14, std: 0.0 }
  - label: "Stage H (post-asm)"
    description: "qwen35-A3B-Int4 (no thinking)"
    verdict: BASELINE
    n: 3
    metrics:
      evaluation_score: { mean: 57.14, std: 0.0 }
  - label: "Stage J"
    description: "qwen30-A3B-Thinking"
    verdict: REGRESS
    n: 3
    metrics:
      evaluation_score: { mean: 28.57, std: 0.0 }
  - label: "Stage K (post-asm)"
    description: "cumulative cross-ep memory"
    verdict: FLAT
    n: 5
    metrics:
      evaluation_score: { mean: 57.14, std: 0.0 }
  - label: "Stage L"
    description: "iter-TTL + map-aware proc keys"
    verdict: NEUTRAL+
    n: 5
    metrics:
      # Per-iter `scores:` renders as colour-coded scatter on the bar
      # (max=green, min=red) — surfaces the dropout iter the σ band hides.
      # Source: experiments/stage_l_map_aware/results.jsonl
      evaluation_score:
        mean: 51.43
        std: 12.78
        scores: [57.14, 57.14, 57.14, 28.57, 57.14]
  - label: "Stage M"
    description: "sdc × novelty × lpc signals"
    verdict: FLAT
    n: 5
    metrics:
      # Source: experiments/stage_m_multi_signal/results.jsonl
      evaluation_score:
        mean: 51.43
        std: 12.78
        scores: [57.14, 57.14, 28.57, 57.14, 57.14]
  - label: "Stage N+O"
    description: "bootstrap-neutral + state-delta acquisition"
    verdict: NEUTRAL+
    n: 5
    metrics:
      # Source: experiments/stage_no_combined/results.jsonl
      evaluation_score:
        mean: 51.43
        std: 12.78
        scores: [28.57, 57.14, 57.14, 57.14, 57.14]
  - label: "Stage P"
    description: "every-step map-graph hint"
    verdict: FLAT
    n: 5
    metrics:
      evaluation_score: { mean: 57.14, std: 0.0 }
  - label: "Stage Q"
    description: "exit-tile coords in graph_hint (iter 1 breached M5; iters 3-5 collapsed)"
    verdict: REGRESS
    n: 5
    metrics:
      # Per-iter scores overlay as scatter on the bar — surfaces the iter 1
      # M5 breach (71.43%, first ever) that the mean ± std band hides.
      # Source: experiments/stage_q_exit_tiles/results.jsonl
      evaluation_score:
        mean: 42.86
        std: 20.20
        scores: [71.43, 57.14, 28.57, 28.57, 28.57]
  - label: "Stage Q2"
    description: "exit-tile + performance-gated proc-cache prune (broke iter 1's M5 breach)"
    verdict: REGRESS
    n: 5
    metrics:
      # Source: experiments/stage_q2_perf_prune/results.jsonl
      # Q2's perf-prune was meant to protect Q's iter 1 M5 breach from
      # cache poisoning, but ended up regressing iter 1 to M4 (57.14%)
      # while iters 2-5 stayed at the 28.57% floor. Net learning_delta
      # = -14.29pp; Q2 strictly worse than Q.
      evaluation_score:
        mean: 34.28
        std: 12.78
        scores: [57.14, 28.57, 28.57, 28.57, 28.57]
