# Curated wandb-Artifact upload list. Each entry maps to a single wandb run
# already in chaleong/orak-{pokemon-red,super-mario,2048}. Run name == dir
# basename == wandb run_id (per run.py:149).
#
# Game-data root is one of:
#   /tmp/orak-planner-prompt/{game}/{run_id}        (post-PR-31 sweep runs)
#   /workspace/orak-2025-starter-kit/game_logs/...  (legacy)
#
# Use scripts/upload_game_logs_to_wandb.py to upload.

# Project name mapping (game → wandb project under chaleong/)
projects:
  pokemon_red: "orak-pokemon-red"
  super_mario: "orak-super-mario"
  twenty_fourty_eight: "orak-2048"

# Game data root
data_roots:
  - "/tmp/orak-planner-prompt"
  - "/workspace/orak-2025-starter-kit/game_logs"

# ── POKEMON RED ──────────────────────────────────────────────────────
