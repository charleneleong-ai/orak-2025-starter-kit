# TGAER PR1 — universal futile-action detector vs baseline, n=3 across 4 games.
#
# Run with:
#   autoresearch-parallel-batch run configs/schedules/tgaer_pr1.yaml
#
# Each slot launches `run.py` from the side's worktree (baseline =
# orak-master-baselines, detector = orak-futile-detector). The completion check
# polls `game_logs/<game>/tgaer_<side>_<game>_*` for an `evaluation_summary.json`
# and forwards (score, run_id, evaluation_summary) to log_experiment, landing
# rows in `experiments/tgaer_pr1_{baseline,detector}/results.jsonl`.
#
# Replaces the bespoke `scripts/tgaer_auto_retry.sh` + `scripts/tgaer_autoheal.py`
# pair (~250 LOC of orchestration) with this declarative spec + autoresearch's
# `parallel_batch` orchestrator (v0.28.0).

experiments_dir: /workspace/orak-futile-detector/experiments
max_parallel: 12
max_attempts_per_run: 4
poll_interval_s: 60
launch_stagger_s: 45

_anchors:
  cmd_gemma: &cmd_gemma
    - ./.venv/bin/python
    - run.py
    - -c
    - gemma_26b
    - --local
    - --games
  completion_summary: &completion_summary
    file: evaluation_summary.json
    score_keys: [mean_score, evaluation_score, score]

slots:
  # ── BASELINE (no detector) — /workspace/orak-master-baselines ───────────
  - label: baseline_pokemon_red
    tag: tgaer_pr1_baseline
    game: pokemon_red
    n_runs: 3
    cwd: /workspace/orak-master-baselines
    log_dir: /workspace/orak-master-baselines/logs
    command: [*cmd_gemma, pokemon_red]
    completion: {<<: *completion_summary, glob: "game_logs/pokemon_red/tgaer_baseline_pokemon_red_*"}

  - label: baseline_super_mario
    tag: tgaer_pr1_baseline
    game: super_mario
    n_runs: 3
    cwd: /workspace/orak-master-baselines
    log_dir: /workspace/orak-master-baselines/logs
    command: [*cmd_gemma, super_mario]
    completion: {<<: *completion_summary, glob: "game_logs/super_mario/tgaer_baseline_super_mario_*"}

  - label: baseline_twenty_fourty_eight
    tag: tgaer_pr1_baseline
    game: twenty_fourty_eight
    n_runs: 3
    cwd: /workspace/orak-master-baselines
    log_dir: /workspace/orak-master-baselines/logs
    command: [*cmd_gemma, twenty_fourty_eight]
    completion: {<<: *completion_summary, glob: "game_logs/twenty_fourty_eight/tgaer_baseline_twenty_fourty_eight_*"}

  - label: baseline_star_craft
    tag: tgaer_pr1_baseline
    game: star_craft
    n_runs: 3
    cwd: /workspace/orak-master-baselines
    log_dir: /workspace/orak-master-baselines/logs
    command: [*cmd_gemma, star_craft]
    completion: {<<: *completion_summary, glob: "game_logs/star_craft/tgaer_baseline_star_craft_*"}

  # ── DETECTOR (PR1) — /workspace/orak-futile-detector ────────────────────
  - label: detector_pokemon_red
    tag: tgaer_pr1_detector
    game: pokemon_red
    n_runs: 3
    cwd: /workspace/orak-futile-detector
    log_dir: /workspace/orak-futile-detector/logs
    command: [*cmd_gemma, pokemon_red]
    completion: {<<: *completion_summary, glob: "game_logs/pokemon_red/tgaer_detector_pokemon_red_*"}

  - label: detector_super_mario
    tag: tgaer_pr1_detector
    game: super_mario
    n_runs: 3
    cwd: /workspace/orak-futile-detector
    log_dir: /workspace/orak-futile-detector/logs
    command: [*cmd_gemma, super_mario]
    completion: {<<: *completion_summary, glob: "game_logs/super_mario/tgaer_detector_super_mario_*"}

  - label: detector_twenty_fourty_eight
    tag: tgaer_pr1_detector
    game: twenty_fourty_eight
    n_runs: 3
    cwd: /workspace/orak-futile-detector
    log_dir: /workspace/orak-futile-detector/logs
    command: [*cmd_gemma, twenty_fourty_eight]
    completion: {<<: *completion_summary, glob: "game_logs/twenty_fourty_eight/tgaer_detector_twenty_fourty_eight_*"}

  - label: detector_star_craft
    tag: tgaer_pr1_detector
    game: star_craft
    n_runs: 3
    cwd: /workspace/orak-futile-detector
    log_dir: /workspace/orak-futile-detector/logs
    command: [*cmd_gemma, star_craft]
    completion: {<<: *completion_summary, glob: "game_logs/star_craft/tgaer_detector_star_craft_*"}
