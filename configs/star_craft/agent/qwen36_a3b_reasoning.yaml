# Qwen 3.6 35B-A3B-GPTQ-Int4 (Reasoning mode) for StarCraft II — A100-40GB.
# Mirror of pokemon_red/qwen36_a3b_reasoning.yaml. Vision OFF — the SC2
# adapter feeds structured unit/resource text from pysc2.
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4"
temperature: 0.7
server_type: "vllm"
supports_vision: false
max_tokens: 8192
max_model_len: 12288
