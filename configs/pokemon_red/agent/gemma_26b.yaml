# Gemma-4-26b-a4b-it (MoE, ~4B active) for Pokemon Red — A100-80GB sized.
# Same Stage D planner setup as gemma.yaml; only the model changes.
# vLLM serves via ./serving/gemma_serve.sh unsloth/gemma-4-26b-a4b-it.
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "unsloth/gemma-4-26b-a4b-it"
temperature: 0.7
server_type: "vllm"
supports_vision: true
max_tokens: 8192
max_model_len: 16384
game_config_path: "pokemon_red"
track: "TRACK1"
use_vector_memory: true
vector_memory_max: 100
vector_memory_top_k: 3
vector_memory_threshold: 0.5
use_subtask_planning: true
subtask_replan_every: 5
subtask_observation_chars: 600
