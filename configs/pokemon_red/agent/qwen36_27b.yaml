# Qwen 3.6 27B FP8 for Pokemon Red — Stage H ceiling check on A100-40GB.
# Dense 27B (Apr 2026 release), FP8 weights ~27 GB, max_model_len=8192 to
# keep KV cache within A100-40GB budget. Same MACLA stack as gemma_26b.yaml
# (vmem + subtask planner ON, procedure layer ON, self-reflection per-game
# adapter default). The variable being tested is *model lineage*, not the
# agent architecture.
#
# To serve:  ./serving/qwen_serve.sh   (after stopping gemma vLLM)
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "Qwen/Qwen3.6-27B-FP8"
temperature: 0.7
server_type: "vllm"
supports_vision: false   # Qwen3.6-27B is text-only; Stage H probes reasoning, not vision
# max_tokens limits OUTPUT tokens. Input + max_tokens must fit within
# vLLM's max_model_len (8192). Pokemon fallback prompts are ~3500 tokens
# (incl. image + history), so we keep max_tokens conservative at 1024.
max_tokens: 1024
max_model_len: 8192
game_config_path: "pokemon_red"
track: "TRACK1"
# Stage C: vector memory
use_vector_memory: true
vector_memory_max: 100
vector_memory_top_k: 3
vector_memory_threshold: 0.5
vector_memory_use_mmr: true
vector_memory_mmr_lambda: 0.5
vector_memory_decay_alpha: 0.5
vector_memory_decay_window: 20
# Stage D: subtask planner
use_subtask_planning: true
subtask_replan_every: 5
subtask_observation_chars: 600
