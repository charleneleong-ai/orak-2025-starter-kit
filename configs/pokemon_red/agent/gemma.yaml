# Gemma-4-E4B-it (multimodal) for Pokemon Red — A100-40GB sized
# See configs/twenty_fourty_eight/agent/gemma.yaml for full notes.
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "unsloth/gemma-4-E4B-it"
temperature: 0.7
server_type: "vllm"
supports_vision: true
max_tokens: 8192
max_model_len: 16384
game_config_path: "pokemon_red"
track: "TRACK1"
# Pokemon ships Stage A: vmem off, planner off. PR #28 cross-game ablation
# (n=2 every cell) shows Stage A=14.29, Stage C=14.29, Stage D=0.00 — vmem
# is dead-weight on pokemon (no lift over A) and the planner regresses by
# −100% because per-step latency leaves too few steps in the 30-min budget
# to reach Oak's Lab. Per-game verdict: pokemon→A, mario→D, 2048→C.
use_vector_memory: false
use_subtask_planning: false
