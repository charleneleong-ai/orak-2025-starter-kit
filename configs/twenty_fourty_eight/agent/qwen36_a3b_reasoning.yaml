# Qwen 3.6 35B-A3B-GPTQ-Int4 (Reasoning mode) for 2048 — A100-40GB.
# Mirror of pokemon_red/qwen36_a3b_reasoning.yaml. macla_* tuning copied
# from twenty_fourty_eight/agent/gemma_26b.yaml — 2048 surfaces fewer
# distinct procedures so the success threshold needs to be sensitive.
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "palmfuture/Qwen3.6-35B-A3B-GPTQ-Int4"
temperature: 0.7
server_type: "vllm"
supports_vision: false
max_tokens: 8192
max_model_len: 12288
game_config_path: "twenty_fourty_eight"
track: "TRACK1"
use_vector_memory: true
vector_memory_max: 100
vector_memory_top_k: 3
vector_memory_threshold: 0.5
use_subtask_planning: true
subtask_replan_every: 5
subtask_observation_chars: 600
macla_n_min_f: 1
macla_n_min_s: 1
macla_theta_decay: 0.001
