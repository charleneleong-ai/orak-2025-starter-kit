# Gemma-4-E4B-it (multimodal) for 2048 — A100-40GB sized
#
# Uses unsloth/gemma-4-E4B-it served via vLLM. Vision-capable (sends
# screenshots natively), no internal "thinking" token spend so a modest
# max_tokens budget is fine.
#
# Local weights: /workspace/.hf_home/hub/models--unsloth--gemma-4-E4B-it
# LoRA adapter:  /workspace/gemma4_rl/gemma_4_lora (Unsloth-trained, optional)
#
# Launch server:
#   ./serving/gemma_serve.sh
#
# Override per-run:
#   LOCAL_MODEL=unsloth/gemma-4-E4B-it python run.py -c gemma ...
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "unsloth/gemma-4-E4B-it"
temperature: 0.7
server_type: "vllm"
supports_vision: true     # Gemma 3n is multimodal — send screenshots
max_tokens: 8192          # No thinking budget needed
max_model_len: 16384
game_config_path: "twenty_fourty_eight"
track: "TRACK1"
# Stage C: opt-in vector memory via VectorMemoryProvider. When True,
# UnifiedMaclaAgent prefetches retrieved memories into the LLM prompt and
# writes events on score increases.
use_vector_memory: true
vector_memory_max: 100
vector_memory_top_k: 3
vector_memory_threshold: 0.5
# Stage D ablation: enable subtask planning to test whether task decomposition
# adds anything on top of vmem (which already gave +58%). 2048's bottleneck was
# asserted to be lookahead-search, not decomposition — this sweep tests that
# claim. replan_every=5 = 1.2x base inference cost.
use_subtask_planning: true
subtask_replan_every: 5
subtask_observation_chars: 600
macla_n_min_f: 1
macla_n_min_s: 1
macla_theta_decay: 0.001
