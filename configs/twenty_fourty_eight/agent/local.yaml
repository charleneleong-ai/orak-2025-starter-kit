# Local model config for 2048
#
# Backends (server_type):
#   vllm   — A100/H100 GPU serving (default). Best throughput.
#   ollama — Easy local Mac/Linux. Uses MLX on Apple Silicon.
#   mlx    — Max perf on Apple Silicon via mlx-lm.
#
# Override at runtime (no YAML edit needed):
#   LOCAL_MODEL=qwen3:8b LOCAL_BASE_URL=http://localhost:11434/v1 python run.py -c local ...
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "Qwen/Qwen3-32B"       # vLLM: HF repo name | Ollama: qwen3:8b | MLX: mlx-community/Qwen3-8B-4bit
temperature: 0.7
server_type: "vllm"            # vllm | ollama | mlx
# Thinking models (Qwen3, DeepSeek-R1) burn tokens on internal reasoning before
# producing JSON. Use 8192+ to give thinking room AND fit structured output.
# Drop to 2048 for non-thinking models (Mistral, Llama 3) to save latency.
max_tokens: 8192
game_config_path: "twenty_fourty_eight"
track: "TRACK2"
# MACLA tuning — same as Gemini baseline
macla_max_theta: 0.35
macla_min_theta: 0.05
macla_theta_base: 0.3
macla_theta_decay: 0.005
macla_warmup_steps: 10
