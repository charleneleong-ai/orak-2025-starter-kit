# Gemma-4-26b-a4b-it (MoE, ~4B active) for Super Mario — A100-80GB sized.
# Mirrors pokemon_red/gemma_26b.yaml — same Stage D planner setup, only the
# model changes. vLLM serves via ./serving/gemma_serve.sh unsloth/gemma-4-26b-a4b-it.
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "unsloth/gemma-4-26b-a4b-it"
temperature: 0.7
server_type: "vllm"
supports_vision: true
max_tokens: 8192
max_model_len: 16384
game_config_path: "super_mario"
track: "TRACK1"
use_vector_memory: true
vector_memory_max: 100
vector_memory_top_k: 3
vector_memory_threshold: 0.5
# Stage D: enabled. PR #28 ablation said Stage D HELPS on mario (+25% vs C
# on E4B). With v13's outcome-tagged history (autoresearch v0.20), retesting
# at 26B to see if the lift stacks with the larger model.
use_subtask_planning: true
subtask_replan_every: 5
subtask_observation_chars: 600
