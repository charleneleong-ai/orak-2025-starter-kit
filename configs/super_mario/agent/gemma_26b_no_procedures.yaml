# Stage B' baseline for mario: Stage D minus the Bayesian procedure cache.
# Disable ONLY use_procedure_layer; keep planner + vmem ON via per-game
# adapter recommendations. Tests whether procedures are responsible for
# mario's −26pp regression Stage B (61.26%) → Stage D (35.21%) on PR #31.
#
# Model: cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit (matches the currently-served
# vLLM model; master's mario yaml predates the AWQ switch).
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit"
temperature: 0.7
server_type: "vllm"
supports_vision: true
max_tokens: 8192
max_model_len: 16384
game_config_path: "super_mario"
track: "TRACK1"
use_vector_memory: true
vector_memory_max: 100
vector_memory_top_k: 3
vector_memory_threshold: 0.5
use_subtask_planning: true
subtask_replan_every: 5
subtask_observation_chars: 600
use_procedure_layer: false
