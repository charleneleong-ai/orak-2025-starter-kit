# Gemma-4-E4B-it (multimodal) for Super Mario — A100-40GB sized
# See configs/twenty_fourty_eight/agent/gemma.yaml for full notes.
class_name: "agents.macla.unified.UnifiedMaclaAgent"
model: "unsloth/gemma-4-E4B-it"
temperature: 0.7
server_type: "vllm"
supports_vision: true
max_tokens: 8192
max_model_len: 16384
game_config_path: "super_mario"
track: "TRACK1"
# Stage C: opt-in vector memory via VectorMemoryProvider. When True,
# UnifiedMaclaAgent prefetches retrieved memories into the LLM prompt and
# writes events on score increases.
use_vector_memory: true
vector_memory_max: 100
vector_memory_top_k: 3
vector_memory_threshold: 0.5
# Stage D: enabled. Ablation (PR #28, 2026-05-02) measured Δ = +25% vs Stage C
# on `mario_check` baseline → HELPS. The "perception/timing only" theory was
# wrong: sub-goal scaffolding helps the agent persist past death clusters
# (x=1000-1100). 1.2x inference cost from replan_every=5 is justified.
use_subtask_planning: true
subtask_replan_every: 5
subtask_observation_chars: 600
