# vLLM serving for MACLA on A100/H100
#
# Usage:
#   docker compose -f serving/docker-compose.vllm.yaml up
#
# Override model:
#   VLLM_MODEL=moonshotai/Kimi-K2-Instruct VLLM_TP=4 docker compose -f serving/docker-compose.vllm.yaml up
#
# Presets:
#   Qwen3-32B on 1x A100-80GB:   VLLM_MODEL=Qwen/Qwen3-32B VLLM_TP=1
#   Kimi K2 on 4x A100-80GB:     VLLM_MODEL=moonshotai/Kimi-K2-Instruct VLLM_TP=4 VLLM_QUANT=fp8
#   Llama-4-Scout on 1x A100:    VLLM_MODEL=meta-llama/Llama-4-Scout-17B-16E-Instruct VLLM_TP=1

services:
  vllm:
    image: vllm/vllm-openai:latest
    runtime: nvidia
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_TP:-1}
              capabilities: [gpu]
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-32B}
      --tensor-parallel-size ${VLLM_TP:-1}
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.90}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --trust-remote-code
      --enable-auto-tool-choice
      --dtype auto
      ${VLLM_QUANT:+--quantization ${VLLM_QUANT}}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
